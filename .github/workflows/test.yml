name: test

on:
  push:
    branches: [main]
    paths:
      - "automaton/**"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]
    paths:
      - "automaton/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: automaton

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[tls,secrets-headless]"
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Smoke test the CLI (POSIX)
        if: runner.os != 'Windows'
        run: |
          python -m automaton register examples/hello.yaml
          python -m automaton trigger hello
          python -m automaton worker --once
          python -m automaton inspect

      - name: Smoke test the CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m automaton register examples/hello.yaml
          python -m automaton trigger hello
          python -m automaton worker --once
          python -m automaton inspect

  publish-check:
    name: Build wheel + twine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: pip install build twine

      - name: Build
        working-directory: automaton
        run: python -m build

      - name: Twine check
        working-directory: automaton
        run: twine c
  postgres:
    name: Postgres backend (Ubuntu, py3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automaton

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: automaton
          POSTGRES_PASSWORD: automaton
          POSTGRES_DB: automaton_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U automaton"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + psycopg3 + pytest
        run: pip install -e ".[tls,secrets-headless,postgres]" pytest

      - name: Run Postgres tests
        env:
          AUTOMATON_TEST_PG_URL: postgresql://automaton:automaton@localhost:5432/automaton_test
        run: pytest tests/test_postgres.py -v --tb=short

  validate-templates:
    name: Validate workflow templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        working-directory: automaton
        run: pip install -e ".[dev]"

      - name: Validate all templates via validate_spec
        working-directory: automaton
        run: |
          python3 - << 'PYEOF'
          import yaml, sys
          from pathlib import Path
          from automaton.engine import validate_spec

          templates_dir = Path("templates")
          errors = []
          for path in sorted(templates_dir.glob("*/*.yaml")):
              try:
                  spec = yaml.safe_load(path.read_text(encoding="utf-8"))
                  validate_spec(spec)
                  print(f"  OK  {path}")
              except Exception as e:
                  errors.append((path, e))
                  print(f"FAIL  {path}: {e}", file=sys.stderr)
          if errors:
              sys.exit(1)
          print(f"\nAll {len(list(templates_dir.glob('*/*.yaml')))} templates valid.")
          PYEOF

      - name: Verify INDEX.md is current
        working-directory: automaton
        run: |
          python3 - << 'PYEOF'
          from automaton.templates import render_index
          from pathlib import Path
          expected = render_index()
          actual = Path("templates/INDEX.md").read_text(encoding="utf-8")
          if expected != actual:
              print("ERROR: templates/INDEX.md is stale — run:")
              print("  python3 -c 'from automaton.templates import render_index; "
                    "print(render_index())' > templates/INDEX.md")
              import sys; sys.exit(1)
          print("INDEX.md is current.")
          PYEOF
