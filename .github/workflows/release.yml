name: release

# Two release families share this workflow (ADR-002 Phase 7c):
#
#   v*        — automaton (Python). Wheel + sdist → PyPI via Trusted
#               Publishing (OIDC), GitHub Release with CHANGELOG body.
#   echoes-v* — echoes (Rust). Crate → crates.io, wasm bindings → npm,
#               GitHub Release with the echoes CHANGELOG body.
#
# One-time setup (done once per repo, not per release):
#   PyPI → Account settings → Publishing → Add a new pending publisher:
#     Owner:      730richey730
#     Repository: echoes
#     Workflow:   release.yml
#     Environment: release
#   Then enable the "release" environment in GitHub repo Settings → Environments.
#
#   For echoes-v* tags, two repo secrets are required:
#     CARGO_REGISTRY_TOKEN — crates.io API token (Account → API Tokens,
#                            scope: publish-update)
#     NPM_TOKEN            — npm automation token for @richeyworks scope

on:
  push:
    tags:
      - "v*"         # automaton: v0.3.0, v1.0.0-rc1, etc.
      - "echoes-v*"  # echoes:    echoes-v1.2.0, etc.

permissions:
  contents: write    # needed to create a GitHub Release

jobs:
  # ------------------------------------------------------------------ #
  # 1. Run the full test suite against the tagged commit before         #
  #    publishing. Gate: publish only if tests pass.                    #
  # ------------------------------------------------------------------ #
  test:
    name: Tests (ubuntu, py3.11)
    if: ${{ !startsWith(github.ref_name, 'echoes-') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automaton

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[tls,secrets-headless]" pytest

      - name: pytest
        run: pytest tests/ -q --tb=short

  # ------------------------------------------------------------------ #
  # 2. Build the wheel + sdist and upload them as job artifacts so the  #
  #    publish job can use them without rebuilding.                     #
  # ------------------------------------------------------------------ #
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: automaton

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build + twine
        run: pip install build twine

      - name: Build
        run: python -m build

      - name: Twine check
        run: twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: automaton/dist/

  # ------------------------------------------------------------------ #
  # 3. Publish to PyPI via Trusted Publishing (OIDC — no API token).   #
  # ------------------------------------------------------------------ #
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: release          # requires the "release" env in repo settings
    permissions:
      id-token: write             # OIDC token for Trusted Publishing

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # ------------------------------------------------------------------ #
  # 4. Create a GitHub Release and attach the wheel + sdist.            #
  #    The release body is extracted from CHANGELOG.md automatically.   #
  # ------------------------------------------------------------------ #
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish-pypi

    steps:
      - uses: actions/checkout@v4

      - name: Extract CHANGELOG entry for this version
        id: changelog
        run: |
          # Pull the block between the current version header and the next.
          VERSION="${GITHUB_REF_NAME#v}"   # strip leading 'v'
          export VERSION
          BODY=$(python3 - <<'PYEOF'
          import os, re, sys, pathlib
          version = os.environ["VERSION"]
          src = pathlib.Path("automaton/CHANGELOG.md").read_text()
          # Match from ## [VERSION] down to (but not including) the next ## [
          pattern = rf"## \[{re.escape(version)}\].*?(?=\n## \[|\Z)"
          m = re.search(pattern, src, re.DOTALL)
          print(m.group(0).strip() if m else f"Release {version}")
          PYEOF
          )
          # Store as a multiline output
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}

  # ==================================================================== #
  # echoes-v* tags: Rust crate → crates.io, wasm bindings → npm           #
  # ==================================================================== #

  # ------------------------------------------------------------------ #
  # R1. Gate: fmt + clippy + tests for both crates, incl. wasm parity.  #
  # ------------------------------------------------------------------ #
  test-echoes:
    name: Rust tests (echoes + echoes-wasm)
    if: ${{ startsWith(github.ref_name, 'echoes-v') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: echoes — clippy + test (default and watch features)
        working-directory: echoes-v1.0-forensic/echoes
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features watch -- -D warnings
          cargo test --locked
          cargo test --locked --features watch

      - name: echoes-wasm — clippy + native parity tests
        working-directory: echoes-v1.0-forensic/echoes-wasm
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  # ------------------------------------------------------------------ #
  # R2. Publish the echoes crate to crates.io.                          #
  # ------------------------------------------------------------------ #
  publish-crate:
    name: Publish to crates.io
    if: ${{ startsWith(github.ref_name, 'echoes-v') }}
    runs-on: ubuntu-latest
    needs: test-echoes
    environment: release

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches Cargo.toml version
        working-directory: echoes-v1.0-forensic/echoes
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#echoes-v}"
          CRATE_VERSION=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import sys,json; print([p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='echoes'][0])")
          if [ "$TAG_VERSION" != "$CRATE_VERSION" ]; then
            echo "tag says $TAG_VERSION but Cargo.toml says $CRATE_VERSION" >&2
            exit 1
          fi

      - name: cargo publish
        working-directory: echoes-v1.0-forensic/echoes
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  # ------------------------------------------------------------------ #
  # R3. Build the wasm bindings and publish to npm.                     #
  # ------------------------------------------------------------------ #
  publish-npm:
    name: Publish to npm
    if: ${{ startsWith(github.ref_name, 'echoes-v') }}
    runs-on: ubuntu-latest
    needs: test-echoes
    environment: release

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: wasm-pack build
        working-directory: echoes-v1.0-forensic/echoes-wasm
        run: wasm-pack build --target bundler --out-name echoes_wasm

      - name: npm publish
        working-directory: echoes-v1.0-forensic/echoes-wasm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  # ------------------------------------------------------------------ #
  # R4. Prebuilt binaries for the GitHub Release (ADR-002 Phase 7d).    #
  #     Built with the watch feature so release binaries have real      #
  #     filesystem event capture out of the box.                        #
  # ------------------------------------------------------------------ #
  build-binaries:
    name: Binary (${{ matrix.target }})
    if: ${{ startsWith(github.ref_name, 'echoes-v') }}
    runs-on: ${{ matrix.os }}
    needs: test-echoes
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build (release, watch feature)
        working-directory: echoes-v1.0-forensic/echoes
        run: cargo build --locked --release --features watch --target ${{ matrix.target }}

      - name: Package (tar.gz on unix)
        if: runner.os != 'Windows'
        working-directory: echoes-v1.0-forensic/echoes
        run: |
          VERSION="${GITHUB_REF_NAME#echoes-v}"
          STAGE="echoes-${VERSION}-${{ matrix.target }}"
          mkdir "$STAGE"
          cp "target/${{ matrix.target }}/release/echoes" LICENSE README.md CHANGELOG.md "$STAGE/"
          tar czf "$STAGE.tar.gz" "$STAGE"

      - name: Package (zip on windows)
        if: runner.os == 'Windows'
        working-directory: echoes-v1.0-forensic/echoes
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^echoes-v', ''
          $stage = "echoes-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/echoes.exe", "LICENSE", "README.md", "CHANGELOG.md" -Destination $stage
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: echoes-binary-${{ matrix.target }}
          path: |
            echoes-v1.0-forensic/echoes/echoes-*.tar.gz
            echoes-v1.0-forensic/echoes/echoes-*.zip
          if-no-files-found: error

  # ------------------------------------------------------------------ #
  # R5. GitHub Release for echoes with its own CHANGELOG body and the   #
  #     prebuilt binaries attached.                                     #
  # ------------------------------------------------------------------ #
  github-release-echoes:
    name: Create GitHub Release (echoes)
    if: ${{ startsWith(github.ref_name, 'echoes-v') }}
    runs-on: ubuntu-latest
    needs: [publish-crate, publish-npm, build-binaries]

    steps:
      - uses: actions/checkout@v4

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: echoes-binary-*
          path: binaries/
          merge-multiple: true

      - name: Extract CHANGELOG entry for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#echoes-v}"
          export VERSION
          BODY=$(python3 - <<'PYEOF'
          import os, re, pathlib
          version = os.environ["VERSION"]
          src = pathlib.Path("echoes-v1.0-forensic/echoes/CHANGELOG.md").read_text()
          pattern = rf"## \[{re.escape(version)}\].*?(?=\n## \[|\Z)"
          m = re.search(pattern, src, re.DOTALL)
          print(m.group(0).strip() if m else f"echoes {version}")
          PYEOF
          )
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: binaries/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
