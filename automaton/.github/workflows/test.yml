name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[tls,secrets-headless]"
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Smoke test the CLI (POSIX)
        if: runner.os != 'Windows'
        run: |
          python -m automaton register examples/hello.yaml
          python -m automaton trigger hello
          python -m automaton worker --once
          python -m automaton inspect

      - name: Smoke test the CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m automaton register examples/hello.yaml
          python -m automaton trigger hello
          python -m automaton worker --once
          python -m automaton inspect

  publish-check:
    name: Build wheel + twine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: pip install build twine

      - name: Build
        working-directory: automaton
        run: python -m build

      - name: Twine check
        working-directory: automaton
        run: twine check dist/*

  publish-check:
    name: Build wheel + twine check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automaton
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: pip install build twine

      - name: Build
        run: python -m build

      - name: Twine check
        run: twine check dist/*
