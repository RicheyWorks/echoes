name: docs

on:
  push:
    branches: [main]
    paths:
      - "automaton/docs/**"
      - "automaton/mkdocs.yml"
      - ".github/workflows/docs.yml"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write   # needed to push to gh-pages branch

jobs:
  deploy:
    name: Build & deploy MkDocs site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # mkdocs-material git-revision-date plugin needs full history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install mkdocs-material
        run: pip install mkdocs-material

      - name: Build and deploy
        working-directory: automaton
        run: mkdocs gh-deploy --force --clean
        # Pushes the built site to the gh-pages branch.
        # GitHub Pages must be configured to serve from gh-pages in repo settings.
