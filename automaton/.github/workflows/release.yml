name: release

# Triggers when you push a version tag: git tag v0.3.0 && git push --tags
# Builds the wheel + sdist, publishes to PyPI via Trusted Publishing (OIDC),
# and creates a GitHub Release whose body is the matching CHANGELOG entry.
#
# One-time setup (done once per repo, not per release):
#   PyPI → Account settings → Publishing → Add a new pending publisher:
#     Owner:      730richey730
#     Repository: echoes
#     Workflow:   release.yml
#     Environment: release
#   Then enable the "release" environment in GitHub repo Settings → Environments.

on:
  push:
    tags:
      - "v*"         # v0.3.0, v1.0.0-rc1, etc.

permissions:
  contents: write    # needed to create a GitHub Release

jobs:
  # ------------------------------------------------------------------ #
  # 1. Run the full test suite against the tagged commit before         #
  #    publishing. Gate: publish only if tests pass.                    #
  # ------------------------------------------------------------------ #
  test:
    name: Tests (ubuntu, py3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automaton

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[tls,secrets-headless]" pytest

      - name: pytest
        run: pytest tests/ -q --tb=short

  # ------------------------------------------------------------------ #
  # 2. Build the wheel + sdist and upload them as job artifacts so the  #
  #    publish job can use them without rebuilding.                     #
  # ------------------------------------------------------------------ #
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: automaton

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build + twine
        run: pip install build twine

      - name: Build
        run: python -m build

      - name: Twine check
        run: twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: automaton/dist/

  # ------------------------------------------------------------------ #
  # 3. Publish to PyPI via Trusted Publishing (OIDC — no API token).   #
  # ------------------------------------------------------------------ #
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: release          # requires the "release" env in repo settings
    permissions:
      id-token: write             # OIDC token for Trusted Publishing

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # ------------------------------------------------------------------ #
  # 4. Create a GitHub Release and attach the wheel + sdist.            #
  #    The release body is extracted from CHANGELOG.md automatically.   #
  # ------------------------------------------------------------------ #
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish-pypi

    steps:
      - uses: actions/checkout@v4

      - name: Extract CHANGELOG entry for this version
        id: changelog
        run: |
          # Pull the block between the current version header and the next.
          VERSION="${GITHUB_REF_NAME#v}"   # strip leading 'v'
          BODY=$(python3 - <<'PYEOF'
          import re, sys, pathlib
          version = "$VERSION"
          src = pathlib.Path("automaton/CHANGELOG.md").read_text()
          # Match from ## [VERSION] down to (but not including) the next ## [
          pattern = rf"## \[{re.escape(version)}\].*?(?=\n## \[|\Z)"
          m = re.search(pattern, src, re.DOTALL)
          print(m.group(0).strip() if m else f"Release {version}")
          PYEOF
          )
          # Store as a multiline output
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
