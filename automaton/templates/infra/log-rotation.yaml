# Daily log rotation — compress and prune automaton's own logs.
# Description: Compresses *.log files in LOG_DIR at 00:05 nightly, then
#   deletes compressed logs older than KEEP_DAYS days.
# Required secrets: none
# Required env: gzip, find
# Cron: "5 0 * * *"
# Last verified: 2026-05-23

name: infra-log-rotation

triggers:
  - cron: "5 0 * * *"

steps:
  - name: compress_logs
    type: shell
    cmd:
      - sh
      - -c
      - |
        for f in LOG_DIR/*.log; do
          [ -f "$f" ] || continue
          gzip -9 "$f" && echo "compressed $f"
        done

  - name: prune_old
    type: shell
    needs: [compress_logs]
    cmd:
      - sh
      - -c
      - |
        find LOG_DIR -name "*.log.gz" -mtime +KEEP_DAYS -delete
        echo "pruned files older than KEEP_DAYS days"
