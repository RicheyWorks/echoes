# Human-in-the-loop agent pattern using wait_for_signal.
# Description: Starts a task, pauses with wait_for_signal, then records the
#   result once a human (or external agent) resumes the run via the signal API.
#   Resume with: POST /api/signal/<run_id>/resume  {"payload": {"result": "..."}}
# Required secrets: none
# Required env: none
# Cron: trigger manually
# Last verified: 2026-05-23

name: agent-claude-loop

steps:
  - name: prepare
    type: file_append
    path: "OUTPUT_FILE"
    text: "run=${{ run.id }} started: TASK\n"

  - name: wait_for_agent
    type: wait_for_signal
    needs: [prepare]
    signal_name: resume
    timeout_seconds: 86400

  - name: record_result
    type: file_append
    needs: [wait_for_agent]
    path: "OUTPUT_FILE"
    text: "run=${{ run.id }} result: ${{ steps.wait_for_agent.output.payload }}\n"
