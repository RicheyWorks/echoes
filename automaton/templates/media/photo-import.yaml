# Photo import from SD card / camera to a dated library folder.
# Description: Walks SD_MOUNT looking for common photo and video formats.
#   Copies new files into LIBRARY_DIR/YYYY/YYYY-MM-DD/ without overwriting
#   anything that's already there.
# Required secrets: none
# Required env: bash, find, cp, date, stat
# Cron: trigger manually (run when card is mounted)
# Last verified: 2026-05-23

name: media-photo-import

steps:
  - name: import_photos
    type: shell
    cmd:
      - sh
      - -c
      - |
        sd="SD_MOUNT"
        lib="LIBRARY_DIR"
        count=0
        find "$sd" -type f \( -iname "*.jpg" -o -iname "*.cr2" \
             -o -iname "*.cr3" -o -iname "*.arw" -o -iname "*.nef" \
             -o -iname "*.mp4" -o -iname "*.mov" \) | \
        while IFS= read -r src; do
          day=$(date -r "$src" "+%Y/%Y-%m-%d" 2>/dev/null \
                || stat -c "%y" "$src" | cut -d' ' -f1 | awk -F- '{print $1"/"$0}')
          dest="$lib/$day"; mkdir -p "$dest"
          fname=$(basename "$src")
          [ ! -f "$dest/$fname" ] && cp "$src" "$dest/$fname" && count=$((count+1))
        done
        echo "imported $count files"

  - name: log_import
    type: file_append
    needs: [import_photos]
    path: "LOG_FILE"
    text: "run=${{ run.id }} ${{ steps.import_photos.output.stdout }}\n"
