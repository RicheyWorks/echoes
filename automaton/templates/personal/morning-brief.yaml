# Daily morning digest — weather fetch written to a text file.
# Description: Fetches weather from WEATHER_URL (wttr.in or similar) every
#   morning at 07:00 and appends a formatted digest to BRIEF_FILE.
#   Extend by adding steps for calendar, RSS, or other sources.
# Required secrets: none
# Required env: none (uses built-in http_get step)
# Cron: "0 7 * * *"
# Last verified: 2026-05-23

name: personal-morning-brief

triggers:
  - cron: "0 7 * * *"

steps:
  - name: fetch_weather
    type: http_get
    url: "WEATHER_URL"
    timeout_seconds: 10

  - name: write_brief
    type: file_append
    needs: [fetch_weather]
    path: "BRIEF_FILE"
    text: "=== Morning Brief run=${{ run.id }} ===\nWeather: ${{ steps.fetch_weather.output.body }}\n"
