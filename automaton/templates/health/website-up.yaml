# HTTP health check — alerts when a site stops returning 200.
# Description: Probes TARGET_URL every 15 minutes. Exits non-zero (triggering
#   AUTOMATON_NOTIFY_ON_FAILURE if set) when the response code is not 200.
# Required secrets: none
# Required env: none (uses built-in http_get step)
# Cron: "*/15 * * * *"
# Last verified: 2026-05-23

name: health-website-up

triggers:
  - cron: "*/15 * * * *"

steps:
  - name: probe
    type: http_get
    url: "TARGET_URL"
    timeout_seconds: 10

  - name: check_status
    type: shell
    needs: [probe]
    cmd:
      - sh
      - -c
      - |
        code="${{ steps.probe.output.status_code }}"
        if [ "$code" != "200" ]; then
          echo "WARN: got HTTP $code" >&2; exit 1
        fi
        echo "OK: $code"
