# Cert expiry check: warns if a TLS cert expires within 14 days.
#
# Description: Connects to a host:port, reads the server cert, fails the
#              run (triggering the failure notification) if not_valid_after
#              is within 14 days.
# Required env: openssl on PATH
# Cron: 0 9 * * MON         (every Monday 9am local)
# Last verified: 2026-05-21
name: cert-expiry
steps:
  - name: check
    type: shell
    cmd:
      - python
      - -c
      - |
        import socket, ssl, datetime, sys
        host = "${{ run.payload.host }}"
        port = int("${{ run.payload.port }}" or "443")
        ctx = ssl.create_default_context()
        with socket.create_connection((host, port), timeout=10) as s:
            with ctx.wrap_socket(s, server_hostname=host) as ws:
                cert = ws.getpeercert()
        not_after = datetime.datetime.strptime(
            cert["notAfter"], "%b %d %H:%M:%S %Y %Z"
        )
        days = (not_after - datetime.datetime.utcnow()).days
        print(f"{host}:{port} expires in {days} days ({not_after})")
        if days < 14:
            sys.exit(1)
