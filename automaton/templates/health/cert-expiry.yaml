# TLS certificate expiry checker.
# Description: Checks the TLS cert for DOMAIN every Monday morning. Fails
#   (and alerts) when fewer than WARN_DAYS days remain before expiry.
# Required secrets: none
# Required env: openssl
# Cron: "0 9 * * 1"
# Last verified: 2026-05-23

name: health-cert-expiry

triggers:
  - cron: "0 9 * * 1"   # 09:00 every Monday

steps:
  - name: check_expiry
    type: shell
    cmd:
      - sh
      - -c
      - |
        domain="DOMAIN"
        warn_days=WARN_DAYS
        expiry=$(echo | openssl s_client -servername "$domain" \
          -connect "$domain":443 2>/dev/null \
          | openssl x509 -noout -enddate 2>/dev/null \
          | cut -d= -f2)
        [ -z "$expiry" ] && { echo "ERROR: no cert for $domain" >&2; exit 1; }
        expiry_epoch=$(date -d "$expiry" +%s 2>/dev/null \
          || date -j -f "%b %d %T %Y %Z" "$expiry" +%s)
        days_left=$(( (expiry_epoch - $(date +%s)) / 86400 ))
        echo "days_left=$days_left"
        [ "$days_left" -lt "$warn_days" ] && { echo "WARN: $days_left days left" >&2; exit 1; }
