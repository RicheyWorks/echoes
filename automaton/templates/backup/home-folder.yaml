# Daily rclone backup of a local folder to a remote destination.
# Description: Syncs SOURCE_DIR to a remote rclone destination every night at 03:00.
#   Appends the exit code to a log file after each run.
# Required secrets: none (rclone credentials live in rclone.conf)
# Required env: rclone (brew install rclone / apt install rclone)
# Cron: "0 3 * * *"
# Last verified: 2026-05-23

name: backup-home-folder

triggers:
  - cron: "0 3 * * *"   # 03:00 every night

steps:
  - name: run_backup
    type: shell
    cmd:
      - rclone
      - sync
      - "SOURCE_DIR"
      - "REMOTE"
      - --log-level
      - INFO

  - name: log_result
    type: file_append
    needs: [run_backup]
    path: "LOG_FILE"
    text: "run=${{ run.id }} backup exit=${{ steps.run_backup.output.returncode }}\n"
