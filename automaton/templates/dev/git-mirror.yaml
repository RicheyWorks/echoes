# Nightly GitHub repository mirror to a local bare clone.
# Description: Clones or updates a bare mirror of REPO_URL to MIRROR_DIR
#   every night. Supports private repos via the GITHUB_TOKEN secret.
# Required secrets: GITHUB_TOKEN (optional, for private repos)
# Required env: git
# Cron: "0 2 * * *"
# Last verified: 2026-05-23

name: dev-git-mirror

triggers:
  - cron: "0 2 * * *"

steps:
  - name: mirror
    type: shell
    cmd:
      - sh
      - -c
      - |
        repo_url="REPO_URL"
        mirror_dir="MIRROR_DIR"
        if [ -d "$mirror_dir" ]; then
          git -C "$mirror_dir" remote update --prune
        else
          git clone --mirror "$repo_url" "$mirror_dir"
        fi

  - name: log_result
    type: file_append
    needs: [mirror]
    path: "LOG_FILE"
    text: "run=${{ run.id }} mirrored REPO_URL exit=${{ steps.mirror.output.returncode }}\n"
