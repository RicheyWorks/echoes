# Weekly Docker system prune to reclaim disk space.
# Description: Runs docker container/image/volume/buildx prune every Sunday
#   at 04:00, then appends a summary to LOG_FILE.
# Required secrets: none
# Required env: docker (user must be in the docker group)
# Cron: "0 4 * * 0"
# Last verified: 2026-05-23

name: dev-docker-prune

triggers:
  - cron: "0 4 * * 0"

steps:
  - name: prune
    type: shell
    cmd:
      - sh
      - -c
      - |
        docker container prune -f
        docker image prune -f
        docker volume prune -f
        docker buildx prune -f

  - name: log_summary
    type: file_append
    needs: [prune]
    path: "LOG_FILE"
    text: "run=${{ run.id }} docker prune done\n"
