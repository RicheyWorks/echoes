site_name: automaton
site_description: A strongly consistent personal automation platform
site_url: https://RicheyWorks.github.io/echoes/
repo_url: https://github.com/RicheyWorks/echoes
repo_name: RicheyWorks/echoes
edit_uri: edit/main/automaton/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/RicheyWorks/echoes

nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started/install.md
      - Quickstart: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
  - Deployment:
      - Overview: deployment/overview.md
      - Linux (systemd): deployment/linux.md
      - macOS (launchd): deployment/macos.md
      - Windows (NSSM): deployment/windows.md
      - Docker: deployment/docker.md
      - iOS client: deployment/ios.md
      - Android client: deployment/android.md
      - Mesh networking: deployment/mesh.md
      - TLS setup: deployment/tls.md
  - Operations:
      - Backup & restore: operations/backup.md
      - Restore runbook: operations/restore.md
      - Scale & performance: operations/scale.md
      - Metrics (Prometheus): operations/metrics.md
      - Live-test readiness: operations/readiness.md
  - Reference:
      - CLI reference: reference/cli.md
      - HTTP API: reference/api.md
      - Workflow YAML: reference/workflow-yaml.md
      - Step types: reference/step-types.md
      - Workflow templates: reference/templates.md
  - Changelog: changelog.md
