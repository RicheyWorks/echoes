[project]
# PyPI distribution name. The import name stays `automaton`.
# ("automaton" is already taken on PyPI — automaton-engine is the
# published name; `pip install automaton-engine` then `import automaton`.)
name = "automaton-engine"
version = "0.5.0"
description = "A strongly consistent personal automation platform"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Richmond", email = "730richey730@gmail.com" },
]
keywords = [
    "automation", "workflow", "scheduler", "sqlite", "cron",
    "personal-infrastructure", "agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "croniter>=2.0",
    "yoyo-migrations>=9.0",
    "keyring>=25.0",
    "apprise>=1.10",
]

[project.urls]
Homepage       = "https://github.com/RicheyWorks/echoes"
Repository     = "https://github.com/RicheyWorks/echoes"
"Bug Tracker"  = "https://github.com/RicheyWorks/echoes/issues"
Changelog      = "https://github.com/RicheyWorks/echoes/blob/main/automaton/CHANGELOG.md"

[project.optional-dependencies]
# Run the test suite.
test = ["pytest>=7.0", "cryptography>=42.0", "keyrings.alt>=5.0"]
# TLS cert generation for the built-in UI server (`automaton tls init`).
# The engine and CLI work without it.
tls = ["cryptography>=42.0"]
# Encrypted-file fallback keyring for headless Linux servers (no D-Bus).
secrets-headless = ["keyrings.alt>=5.0"]
# Postgres backend (Phase 6).  Set AUTOMATON_DB_URL=postgresql://... to activate.
# psycopg[binary] bundles libpq so no separate Postgres client install is needed.
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
automaton = "automaton.cli:main"

# External step types register here. Each entry's value must point to a
# module that calls @step_type("name") on import. The plugin is discovered
# automatically at startup — no edit to steps.py required.
#
# Example (in an external package's pyproject.toml):
#   [project.entry-points."automaton.step_types"]
#   my_step = "my_package.module"
[project.entry-points."automaton.step_types"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["automaton"]

[tool.setuptools.package-data]
automaton = [
    "py.typed",
    "migrations/*.sql",
    "schema.sql",
]
